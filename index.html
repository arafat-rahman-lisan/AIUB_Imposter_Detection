<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>AIUB Imposter Detection</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:Arial,sans-serif}
  #wrap{position:fixed;inset:0;background:#000;overflow:hidden}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
  .hud{position:absolute;inset:0;pointer-events:none}
  .cluster{position:absolute;display:flex;gap:10px;align-items:center;pointer-events:auto}
  #move{left:max(14px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:70px 70px 70px;grid-template-rows:58px 58px;gap:8px}
  #actions{right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:64px 78px 64px;grid-template-rows:54px 60px;gap:8px}
  #top{right:max(12px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));gap:7px}
  button{border:1px solid rgba(255,255,255,.55);background:rgba(8,12,18,.62);color:#fff;border-radius:16px;font-weight:800;font-size:18px;min-width:58px;min-height:48px;box-shadow:0 3px 12px rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
  button:active,.pressed{background:rgba(255,255,255,.26);transform:scale(.96)}
  .small{min-width:48px;min-height:40px;font-size:14px;border-radius:13px;padding:0 11px}
  #left{grid-column:1;grid-row:2} #jump{grid-column:2;grid-row:1} #right{grid-column:3;grid-row:2} #down{grid-column:2;grid-row:2}
  #call{grid-column:1;grid-row:1;font-size:12px} #act{grid-column:2;grid-row:1;font-size:14px} #brick{grid-column:3;grid-row:1;font-size:12px} #attack{grid-column:2;grid-row:2;font-size:14px;background:rgba(95,15,15,.66)}
  #rotateNotice{display:none;position:absolute;inset:0;z-index:50;background:#090b10;color:white;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
  #status{position:absolute;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:12px;font-size:12px;pointer-events:none;opacity:.85;white-space:nowrap}
  @media (orientation:portrait){#rotateNotice{display:flex}}
  @media (max-height:480px){#move{grid-template-columns:60px 60px 60px;grid-template-rows:50px 50px}#actions{grid-template-columns:56px 66px 56px;grid-template-rows:48px 52px}button{min-height:44px;font-size:15px}.small{min-height:36px}#status{font-size:10px}}

  /* Customizable mobile control layout */
  #layout{font-size:11px;min-width:62px}
  #resetLayout{font-size:10px;min-width:58px;display:none}
  #editHint{display:none;position:absolute;left:50%;bottom:145px;transform:translateX(-50%);z-index:45;
    background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.6);border-radius:12px;padding:7px 11px;
    color:#fff;font-size:12px;font-weight:800;pointer-events:none;white-space:nowrap}
  body.edit-controls .gamebtn{outline:2px dashed rgba(255,255,255,.85);outline-offset:2px;cursor:move}
  body.edit-controls #editHint{display:block}
  body.edit-controls #resetLayout{display:inline-block}
  .gamebtn.custom-pos{position:fixed!important;margin:0!important;z-index:40!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="status">3 deaths = full restart • deaths 1–2 return to latest checkpoint • MOVE BTNS lets you arrange controls</div>
  <div class="hud">
    <div id="move" class="cluster">
      <button id="jump" class="gamebtn">▲</button><button id="left" class="gamebtn">◀</button><button id="down" class="gamebtn">▼</button><button id="right" class="gamebtn">▶</button>
    </div>
    <div id="actions" class="cluster">
      <button id="call" class="gamebtn">CALL</button><button id="act" class="gamebtn">ACT / E</button><button id="brick" class="gamebtn">BRICK</button><button id="attack" class="gamebtn">ATTACK</button>
    </div>
    <div id="top" class="cluster">
      <button id="start" class="small gamebtn">START</button><button id="night" class="small gamebtn">DAY/NIGHT</button><button id="reset" class="small gamebtn">RESET</button><button id="layout" class="small layout-tool">MOVE BTNS</button><button id="resetLayout" class="small layout-tool">RESET POS</button>
    </div>
  </div>
  <div id="editHint">EDIT MODE: drag any game button • tap LOCK BTNS when finished</div>
  <div id="rotateNotice">Rotate your phone to landscape mode to play.</div>
</div>

  const b=e.target.closest('.gamebtn'); if(!b)return;
  e.preventDefault(); e.stopImmediatePropagation();
  const r=b.getBoundingClientRect();
  if(!b.classList.contains('custom-pos')){
    b.classList.add('custom-pos'); b.style.left=r.left+'px'; b.style.top=r.top+'px'; b.style.width=r.width+'px'; b.style.height=r.height+'px';
  }
  dragState={b,dx:e.clientX-r.left,dy:e.clientY-r.top,pid:e.pointerId};
  b.setPointerCapture?.(e.pointerId);
}
function moveControlDrag(e){
  if(!dragState||e.pointerId!==dragState.pid)return;
  e.preventDefault(); e.stopImmediatePropagation();
  const b=dragState.b, r=b.getBoundingClientRect();
  let left=e.clientX-dragState.dx, top=e.clientY-dragState.dy;
  left=Math.max(2,Math.min(innerWidth-r.width-2,left)); top=Math.max(2,Math.min(innerHeight-r.height-2,top));
  b.style.left=left+'px'; b.style.top=top+'px';
}
function endControlDrag(e){
  if(!dragState||e.pointerId!==dragState.pid)return;
  e.preventDefault(); e.stopImmediatePropagation(); saveControlPositions(); dragState=null;
}
document.addEventListener('pointerdown',startControlDrag,true);
document.addEventListener('pointermove',moveControlDrag,true);
document.addEventListener('pointerup',endControlDrag,true);
document.addEventListener('pointercancel',endControlDrag,true);
document.getElementById('layout').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setEditControls(!editControls)});
document.getElementById('resetLayout').addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  try{localStorage.removeItem(CONTROL_STORE)}catch(_){}
  for(const b of movableButtons){b.classList.remove('custom-pos');b.style.left=b.style.top=b.style.width=b.style.height=''}
});
loadControlPositions();

setTimeout(()=>{const s=document.getElementById('status');s.style.transition='opacity .8s';s.style.opacity='.15'},7000);
</script>
</body>
</html>
